<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razão XP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EFE0; --paper-deep:#ECE3C8; --rule:#D9CCA3; --rule-strong:#C7B583;
    --ink:#221F1A; --ink-soft:#6E6552; --red:#9B3A2C; --green:#3E6B4E;
    --gold:#A1791F; --navy:#28344A; --navy-soft:#3C4A65; --white:#FFFCF3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#EFE8D4;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);min-height:100vh;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px;}
  .ledger{
    background:repeating-linear-gradient(to bottom, transparent, transparent 31px, var(--rule) 32px), var(--paper);
    border:1px solid var(--rule-strong);
    box-shadow:0 1px 0 var(--rule-strong), 0 8px 28px rgba(34,31,26,0.12);
    padding:0 0 36px 0; position:relative;
  }
  .ledger::before{content:"";position:absolute;left:78px;top:0;bottom:0;width:1px;background:var(--red);opacity:0.28;}
  .ledger-head{padding:34px 40px 22px 96px;border-bottom:2px solid var(--ink);position:relative;}
  .ledger-id{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--ink-soft);text-transform:uppercase;}
  .ledger-head h1{font-family:'Spectral SC',serif;font-size:38px;font-weight:600;letter-spacing:0.04em;margin:4px 0 2px 0;color:var(--navy);}
  .subtitle{font-family:'Spectral',serif;font-style:italic;color:var(--ink-soft);margin:0 0 18px 0;font-size:15px;}
  .summary-row{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
  .summary-cell .label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);margin-bottom:3px;}
  .summary-cell .value{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--navy);}
  .level-block{flex:1;min-width:200px;}
  .bar-track{width:100%;height:8px;background:var(--paper-deep);border:1px solid var(--rule-strong);margin-top:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);width:0%;transition:width .4s ease;}
  .hardmode-toggle{display:flex;align-items:flex-start;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);cursor:pointer;margin-top:10px;}
  .hardmode-toggle input{margin-top:2px;}
  .sync-bar{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
  .sync-dot.busy{background:var(--gold);}
  .sync-dot.err{background:var(--red);}
  .sync-bar button{background:none;border:none;color:var(--navy);text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0;}
  section{padding:26px 40px 0 96px;}
  section h2{font-family:'Spectral',serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-soft);border-bottom:1px solid var(--rule-strong);padding-bottom:8px;margin:0 0 16px 0;}
  .section-note{font-family:'Spectral',serif;font-style:italic;color:var(--ink-soft);font-size:13.5px;margin:-6px 0 16px 0;}

  .account-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .account-card{background:var(--white);border:1px solid var(--rule-strong);padding:14px 16px;}
  .account-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:0.08em;}
  .account-card h3{font-family:'Spectral',serif;font-size:17px;margin:4px 0 10px 0;color:var(--navy);}
  .account-balance{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--ink);}
  .account-balance span{color:var(--green);}
  .empty-note{font-family:'IBM Plex Sans',sans-serif;color:var(--ink-soft);font-style:italic;font-size:13px;}

  .entry-panel select,.entry-panel input[type=number],.entry-panel input[type=text]{font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--rule-strong);background:var(--white);color:var(--ink);margin:0 8px 10px 0;}
  .entry-panel label.field{display:inline-flex;flex-direction:column;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-right:8px;}
  .check-field{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;margin:0 12px 10px 0;color:var(--ink-soft);}
  #dynamicFields{margin-top:6px;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;background:var(--navy);color:var(--white);border:none;padding:10px 18px;cursor:pointer;transition:background .15s ease;}
  .btn:hover{background:var(--navy-soft);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);}
  .btn-ghost:hover{background:var(--paper-deep);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn-danger:hover{background:#f3e2dd;}
  .btn-small{font-size:10px;padding:6px 10px;}
  #entryResult{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--green);min-height:18px;}

  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);border-bottom:1px solid var(--rule-strong);padding:6px 8px;}
  td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top;}
  td.credit{color:var(--green);font-weight:600;text-align:right;}
  .empty-row td{color:var(--ink-soft);font-style:italic;font-family:'IBM Plex Sans',sans-serif;}

  .reward-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px;}
  .reward-card{position:relative;background:var(--white);border:1px solid var(--rule-strong);padding:14px 16px;overflow:hidden;}
  .reward-card h4{font-family:'Spectral',serif;font-size:16px;margin:0 0 6px 0;color:var(--navy);padding-right:70px;}
  .reward-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .reward-bar-track{width:100%;height:7px;background:var(--paper-deep);border:1px solid var(--rule-strong);overflow:hidden;}
  .reward-bar-fill{height:100%;background:var(--gold);width:0%;}
  .reward-pct{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .stamp{position:absolute;top:10px;right:10px;width:78px;height:78px;border-radius:50%;border:2.5px double var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.05em;transform:rotate(-11deg);line-height:1.2;}
  .remove-reward{background:none;border:none;color:var(--red);font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline;}
  .add-reward-form{background:var(--paper-deep);border:1px dashed var(--rule-strong);padding:14px 16px;margin-bottom:16px;display:none;}
  .add-reward-form.open{display:block;}

  /* ---- account manager ---- */
  .account-editor{background:var(--white);border:1px solid var(--rule-strong);padding:16px 18px;margin-bottom:16px;}
  .account-editor-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .account-editor-head .acc-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:0.08em;white-space:nowrap;}
  .account-editor-head input.acc-name-input{font-family:'Spectral',serif;font-size:17px;color:var(--navy);border:1px solid transparent;background:transparent;padding:4px 6px;flex:1;min-width:140px;}
  .account-editor-head input.acc-name-input:focus{border-color:var(--rule-strong);background:var(--paper);outline:none;}
  .field-list{margin-bottom:10px;}
  .field-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;border-top:1px dotted var(--rule-strong);padding:9px 0;color:var(--ink-soft);}
  .field-row:first-child{border-top:none;}
  .field-type-tag{background:var(--paper-deep);border:1px solid var(--rule-strong);padding:2px 6px;font-size:9px;text-transform:uppercase;letter-spacing:0.05em;border-radius:2px;flex-shrink:0;}
  .field-row input,.field-row select{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:4px 6px;border:1px solid var(--rule-strong);background:var(--paper);}
  .field-row input.fld-label{width:120px;color:var(--ink);}
  .field-row input[type=number]{width:62px;}
  .field-row label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .field-row .remove-field-btn{margin-left:auto;background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;line-height:1;padding:0 4px;}
  .no-fields-note{font-family:'IBM Plex Sans',sans-serif;font-style:italic;color:var(--ink-soft);font-size:12.5px;padding:6px 0;}
  .add-field-form{background:var(--paper-deep);border:1px dashed var(--rule-strong);padding:10px 12px;margin-top:6px;display:none;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .add-field-form.open{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .add-field-form input,.add-field-form select{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 7px;border:1px solid var(--rule-strong);}
  .add-field-form input.afl-label{width:140px;}
  .add-field-form input[type=number]{width:70px;}
  .account-editor-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .add-account-form{background:var(--paper-deep);border:1px dashed var(--rule-strong);padding:14px 16px;margin-bottom:16px;display:none;}
  .add-account-form.open{display:block;}
  .add-account-form input{font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--rule-strong);width:260px;margin-right:8px;}

  .footer-bar{padding:24px 40px 30px 96px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .footer-bar button{background:none;border:none;color:var(--red);text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0;}

  .setup-card{background:var(--white);border:1px solid var(--rule-strong);padding:32px;font-family:'IBM Plex Sans',sans-serif;}
  .setup-card h1{font-family:'Spectral SC',serif;color:var(--navy);font-size:28px;margin-top:0;}
  .setup-card ol{padding-left:20px;line-height:1.7;}
  .setup-card code{background:var(--paper-deep);padding:1px 6px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .setup-card input{width:100%;padding:10px;border:1px solid var(--rule-strong);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
  .setup-card label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:4px;}
  .setup-msg{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:12px;min-height:18px;}
  .setup-msg.err{color:var(--red);}
  .setup-msg.ok{color:var(--green);}
  .gist-id-box{background:var(--paper-deep);border:1px dashed var(--rule-strong);padding:14px;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;display:none;}

  @media (max-width:700px){
    .ledger::before{left:0;opacity:0;}
    .ledger-head,section,.footer-bar{padding-left:24px;padding-right:24px;}
    .reward-grid{grid-template-columns:1fr;}
    table{font-size:11px;}
    th:nth-child(3),td:nth-child(3){display:none;}
    .setup-card{padding:20px;}
    .field-row .remove-field-btn{margin-left:0;}
  }
</style>
</head>
<body>
<div class="wrap"><div class="ledger" id="app">a abrir…</div></div>

<script>
(function(){
  const LS_TOKEN = 'rx-gh-token';
  const LS_GIST  = 'rx-gh-gist';
  const LS_CACHE = 'rx-cache';
  const GIST_FILENAME = 'razao-xp-data.json';
  const HARD_MODE_MULTIPLIER = 0.6;

  function genId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function defaultAccounts(){
    return [
      { id: genId('acc'), name: 'Leitura', total: 0, fields: [
        { id: 'f_pages', type: 'number', label: 'Páginas', xpPerUnit: 1, bonusThreshold: null, bonusXP: 0 },
        { id: 'f_minutes', type: 'number', label: 'Minutos', xpPerUnit: 1, bonusThreshold: null, bonusXP: 0 },
        { id: 'f_finished', type: 'checkbox', label: 'terminei o livro', xpBonus: 200, multiplyFieldId: 'f_pages', multiplier: 0.3 }
      ]},
      { id: genId('acc'), name: 'Corrida', total: 0, fields: [
        { id: 'f_km', type: 'number', label: 'Km', xpPerUnit: 10, bonusThreshold: 5, bonusXP: 30 },
        { id: 'f_minutes', type: 'number', label: 'Minutos', xpPerUnit: 4, bonusThreshold: null, bonusXP: 0 }
      ]},
      { id: genId('acc'), name: 'Treino de Força', total: 0, fields: [
        { id: 'f_minutes', type: 'number', label: 'Minutos', xpPerUnit: 8, bonusThreshold: 45, bonusXP: 25 }
      ]},
      { id: genId('acc'), name: 'Estudos (Python/Data)', total: 0, fields: [
        { id: 'f_minutes', type: 'number', label: 'Minutos', xpPerUnit: 2, bonusThreshold: null, bonusXP: 0 },
        { id: 'f_exercises', type: 'number', label: 'Exercícios', xpPerUnit: 15, bonusThreshold: null, bonusXP: 0 },
        { id: 'f_module', type: 'checkbox', label: 'terminei módulo/projeto', xpBonus: 300, multiplyFieldId: null, multiplier: 0 }
      ]}
    ];
  }

  function defaultState(){
    return {
      totalXP: 0,
      accounts: defaultAccounts(),
      rewards: [
        { id: genId('r'), name: '(exemplo) The Emperor\'s New Mind — Penrose', costEUR: 15, xpRequired: 1525, xpEarned: 0, completed: false },
        { id: genId('r'), name: '(exemplo) Fim de semana fora', costEUR: 150, xpRequired: 15025, xpEarned: 0, completed: false }
      ],
      logs: [],
      hardMode: false
    };
  }

  let state = null;
  let token = localStorage.getItem(LS_TOKEN) || '';
  let gistId = localStorage.getItem(LS_GIST) || '';
  let syncStatus = 'idle';
  let syncMsg = '';

  function ghHeaders(){
    return { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  }

  async function createGist(initialState){
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: ghHeaders(),
      body: JSON.stringify({ description: 'Razão XP — dados pessoais', public: false, files: { [GIST_FILENAME]: { content: JSON.stringify(initialState, null, 2) } } })
    });
    if (!res.ok) throw new Error('Falha ao criar gist (' + res.status + ')');
    const json = await res.json();
    return json.id;
  }

  async function fetchGistState(){
    const res = await fetch('https://api.github.com/gists/' + gistId, { headers: ghHeaders() });
    if (!res.ok) throw new Error('Falha ao ler gist (' + res.status + ')');
    const json = await res.json();
    const file = json.files[GIST_FILENAME];
    if (!file) throw new Error('Ficheiro de dados não encontrado no gist.');
    return JSON.parse(file.content);
  }

  async function pushGistState(){
    const res = await fetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH', headers: ghHeaders(),
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(state, null, 2) } } })
    });
    if (!res.ok) throw new Error('Falha ao guardar (' + res.status + ')');
  }

  function safeMerge(loaded){
    const base = defaultState();
    if (!loaded || typeof loaded !== 'object') return base;
    const out = base;
    if (typeof loaded.totalXP === 'number') out.totalXP = loaded.totalXP;
    if (Array.isArray(loaded.accounts) && loaded.accounts.length > 0) out.accounts = loaded.accounts;
    if (Array.isArray(loaded.rewards)) out.rewards = loaded.rewards;
    if (Array.isArray(loaded.logs)) out.logs = loaded.logs;
    if (typeof loaded.hardMode === 'boolean') out.hardMode = loaded.hardMode;
    return out;
  }

  async function saveState(){
    syncStatus = 'busy'; renderSyncBar();
    try{
      await pushGistState();
      localStorage.setItem(LS_CACHE, JSON.stringify(state));
      syncStatus = 'ok'; syncMsg = new Date().toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'});
    } catch(e){
      syncStatus = 'err'; syncMsg = 'não foi possível sincronizar — vê a ligação';
      console.error(e);
    }
    renderSyncBar();
  }

  function renderSyncBar(){
    const el = document.getElementById('syncBar');
    if (!el) return;
    const dotClass = syncStatus === 'busy' ? 'busy' : syncStatus === 'err' ? 'err' : '';
    const label = syncStatus === 'busy' ? 'a sincronizar…' : syncStatus === 'err' ? syncMsg : syncStatus === 'ok' ? ('sincronizado · ' + syncMsg) : 'ligado ao gist';
    el.innerHTML = `<span class="sync-dot ${dotClass}"></span><span>${label}</span>
      <button id="copyGistBtn">copiar ID do gist</button>
      <button id="disconnectBtn">desligar</button>`;
    document.getElementById('copyGistBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(gistId);
      el.querySelector('span:nth-child(2)').textContent = 'ID copiado!';
      setTimeout(renderSyncBar, 1200);
    });
    document.getElementById('disconnectBtn').addEventListener('click', () => {
      if (!confirm('Isto desliga este dispositivo do gist (os dados continuam guardados no GitHub). Continuar?')) return;
      localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_GIST); location.reload();
    });
  }

  function renderSetup(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="setup-card">
        <h1>Razão XP — ligação ao GitHub</h1>
        <p>Os teus dados ficam guardados num <strong>Gist privado</strong> na tua conta GitHub, para sincronizares entre dispositivos sem custos.</p>
        <ol>
          <li>Vai a <code>github.com/settings/tokens</code> → <em>Tokens (classic)</em> → <em>Generate new token (classic)</em>.</li>
          <li>Marca apenas o scope <code>gist</code> e gera o token. Copia-o (só é mostrado uma vez).</li>
          <li>Cola o token abaixo.</li>
          <li>Se é o <strong>primeiro dispositivo</strong>, deixa "ID do Gist" em branco — vai ser criado automaticamente.</li>
          <li>Se já configuraste noutro dispositivo, cola aqui o <strong>ID do Gist</strong> que esse dispositivo te mostrou.</li>
        </ol>
        <label>Personal Access Token (classic, scope gist)</label>
        <input type="password" id="setupToken" placeholder="ghp_xxxxxxxxxxxx">
        <label>ID do Gist (deixa em branco no primeiro dispositivo)</label>
        <input type="text" id="setupGist" placeholder="opcional">
        <button class="btn" id="setupConnectBtn">Ligar</button>
        <div class="setup-msg" id="setupMsg"></div>
        <div class="gist-id-box" id="gistIdBox"></div>
      </div>`;
    document.getElementById('setupConnectBtn').addEventListener('click', handleSetupConnect);
  }

  async function handleSetupConnect(){
    const msgEl = document.getElementById('setupMsg');
    const t = document.getElementById('setupToken').value.trim();
    const g = document.getElementById('setupGist').value.trim();
    if (!t){ msgEl.className = 'setup-msg err'; msgEl.textContent = 'Cola o token primeiro.'; return; }
    token = t;
    msgEl.className = 'setup-msg'; msgEl.textContent = 'a ligar…';
    try{
      if (g){
        gistId = g;
        state = safeMerge(await fetchGistState());
      } else {
        const initial = defaultState();
        gistId = await createGist(initial);
        state = initial;
      }
      localStorage.setItem(LS_TOKEN, token);
      localStorage.setItem(LS_GIST, gistId);
      localStorage.setItem(LS_CACHE, JSON.stringify(state));
      if (!g){
        msgEl.className = 'setup-msg ok';
        msgEl.textContent = 'Gist criado! Guarda este ID para configurares outros dispositivos:';
        const box = document.getElementById('gistIdBox');
        box.style.display = 'block'; box.textContent = gistId;
      }
      setTimeout(() => { render(); }, g ? 0 : 1800);
    } catch(e){
      msgEl.className = 'setup-msg err';
      msgEl.textContent = 'Erro: ' + e.message + ' — confirma o token (scope gist) e o ID do gist.';
      console.error(e);
    }
  }

  // ---------- HELPERS ----------
  function fmt(n){ return Math.round(n).toLocaleString('pt-PT'); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function computeLevel(totalXP){
    let level = 1, remaining = totalXP, needed = 250;
    while (remaining >= needed){ remaining -= needed; level++; needed = level * 250; }
    return { level, into: remaining, span: needed };
  }
  function getAccount(id){ return state.accounts.find(a => a.id === id); }

  // ---------- XP ENGINE ----------
  function calcXP(account, values){
    let xp = 0; const parts = [];
    account.fields.forEach(f => {
      if (f.type === 'number'){
        const v = parseFloat(values[f.id]) || 0;
        xp += v * (Number(f.xpPerUnit) || 0);
        if (f.bonusThreshold !== null && f.bonusThreshold !== '' && f.bonusThreshold !== undefined && v >= Number(f.bonusThreshold)){
          xp += Number(f.bonusXP) || 0;
        }
        if (v > 0) parts.push(`${v} ${f.label.toLowerCase()}`);
      } else if (f.type === 'checkbox'){
        if (values[f.id]){
          let b = Number(f.xpBonus) || 0;
          if (f.multiplyFieldId){
            const mv = parseFloat(values[f.multiplyFieldId]) || 0;
            b += mv * (Number(f.multiplier) || 0);
          }
          xp += b;
          parts.push(f.label);
        }
      }
    });
    if (state.hardMode) xp = xp * HARD_MODE_MULTIPLIER;
    return { xp: Math.round(xp), desc: parts.length ? parts.join(' · ') : '—' };
  }

  function pickRandomReward(){
    const active = state.rewards.filter(r => !r.completed);
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
  }

  async function logEntry(accountId, values){
    const account = getAccount(accountId);
    if (!account){ return; }
    const { xp, desc } = calcXP(account, values);
    if (xp <= 0){ document.getElementById('entryResult').textContent = 'Preenche pelo menos um campo antes de lançar.'; return; }
    state.totalXP += xp;
    account.total = (account.total || 0) + xp;
    const reward = pickRandomReward();
    let appliedLabel = '—';
    if (reward){
      reward.xpEarned = Math.min(reward.xpRequired, reward.xpEarned + xp);
      if (reward.xpEarned >= reward.xpRequired) reward.completed = true;
      appliedLabel = reward.name;
    }
    state.logs.unshift({
      id: genId('l'),
      date: new Date().toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }),
      accountName: account.name, desc, xp, appliedTo: appliedLabel
    });
    if (state.logs.length > 60) state.logs.length = 60;
    render();
    await saveState();
    document.getElementById('entryResult').textContent = `+${xp} XP lançados.` + (reward ? ` Aplicados a "${reward.name}".` : ' Adiciona um prémio ao Tesouro para começares a acumular.');
  }

  // ---------- ENTRY PANEL ----------
  function renderEntryFields(account){
    if (!account || account.fields.length === 0){
      return '<p class="empty-note">esta conta ainda não tem campos definidos — adiciona-os em "Gerir Contas" abaixo.</p>';
    }
    return account.fields.map(f => {
      if (f.type === 'number'){
        return `<label class="field">${escapeHtml(f.label)}<input type="number" step="any" id="entry-${f.id}" min="0" value="0"></label>`;
      }
      return `<label class="check-field"><input type="checkbox" id="entry-${f.id}"> ${escapeHtml(f.label)}</label>`;
    }).join('');
  }

  function readEntryValues(account){
    const values = {};
    account.fields.forEach(f => {
      const el = document.getElementById('entry-' + f.id);
      if (!el) return;
      values[f.id] = f.type === 'number' ? (parseFloat(el.value) || 0) : el.checked;
    });
    return values;
  }

  function renderEntryPanel(){
    if (state.accounts.length === 0){
      return `<p class="empty-note">ainda não tens contas. Cria uma em "Gerir Contas" para começares a lançar XP.</p>`;
    }
    return `
      <label class="field" style="display:block;margin-bottom:10px;">Conta
        <select id="accountSelect">
          ${state.accounts.map((a,i) => `<option value="${a.id}">Conta ${String(i+1).padStart(2,'0')} — ${escapeHtml(a.name)}</option>`).join('')}
        </select>
      </label>
      <div id="dynamicFields">${renderEntryFields(state.accounts[0])}</div>
      <button class="btn" id="logEntryBtn">Lançar no Livro</button>
      <div id="entryResult"></div>
    `;
  }

  // ---------- ACCOUNT SUMMARY ----------
  function renderAccountGrid(){
    if (state.accounts.length === 0) return '<p class="empty-note">sem contas — cria a primeira em "Gerir Contas".</p>';
    return `<div class="account-grid">${state.accounts.map((a,i) => `
      <div class="account-card">
        <div class="account-code">Conta ${String(i+1).padStart(2,'0')}</div>
        <h3>${escapeHtml(a.name)}</h3>
        <div class="account-balance"><span>${fmt(a.total||0)}</span> XP</div>
      </div>`).join('')}</div>`;
  }

  // ---------- ACCOUNT MANAGER ----------
  function renderFieldRow(account, field){
    if (field.type === 'number'){
      return `<div class="field-row" data-field-id="${field.id}" data-field-type="number">
        <span class="field-type-tag">núm</span>
        <input class="fld-label" value="${escapeHtml(field.label)}" placeholder="nome do campo">
        <label>XP/unid <input class="fld-xpunit" type="number" step="0.1" value="${field.xpPerUnit ?? 0}"></label>
        <label>bónus se ≥ <input class="fld-threshold" type="number" step="0.1" value="${field.bonusThreshold ?? ''}" placeholder="—"></label>
        <label>+XP bónus <input class="fld-bonusxp" type="number" value="${field.bonusXP ?? ''}" placeholder="—"></label>
        <button class="remove-field-btn" data-account-id="${account.id}" data-field-id="${field.id}" title="remover campo">×</button>
      </div>`;
    }
    const numberFields = account.fields.filter(f => f.type === 'number' && f.id !== field.id);
    const options = '<option value="">— nenhum —</option>' + numberFields.map(f => `<option value="${f.id}" ${field.multiplyFieldId===f.id?'selected':''}>${escapeHtml(f.label)}</option>`).join('');
    return `<div class="field-row" data-field-id="${field.id}" data-field-type="checkbox">
      <span class="field-type-tag">sim/não</span>
      <input class="fld-label" value="${escapeHtml(field.label)}" placeholder="ex: terminei">
      <label>+XP <input class="fld-xpbonus" type="number" value="${field.xpBonus ?? 0}"></label>
      <label>multiplicar por <select class="fld-multfield">${options}</select></label>
      <label>× <input class="fld-mult" type="number" step="0.1" value="${field.multiplier ?? ''}" placeholder="—"></label>
      <button class="remove-field-btn" data-account-id="${account.id}" data-field-id="${field.id}" title="remover campo">×</button>
    </div>`;
  }

  function renderAccountEditor(account, index){
    const fieldsHtml = account.fields.length
      ? account.fields.map(f => renderFieldRow(account, f)).join('')
      : '<p class="no-fields-note">sem campos ainda — adiciona um abaixo.</p>';
    return `
      <div class="account-editor" data-account-id="${account.id}">
        <div class="account-editor-head">
          <span class="acc-code">Conta ${String(index+1).padStart(2,'0')}</span>
          <input class="acc-name-input" value="${escapeHtml(account.name)}">
        </div>
        <div class="field-list">${fieldsHtml}</div>
        <div class="add-field-form" id="addFieldForm-${account.id}">
          <select class="afl-type">
            <option value="number">campo numérico</option>
            <option value="checkbox">sim / não</option>
          </select>
          <input class="afl-label" type="text" placeholder="nome do campo">
          <label>valor XP <input class="afl-xp" type="number" step="0.1" value="1"></label>
          <button class="btn btn-small confirm-add-field-btn" data-account-id="${account.id}">Adicionar Campo</button>
        </div>
        <div class="account-editor-actions">
          <button class="btn btn-ghost btn-small toggle-add-field-btn" data-account-id="${account.id}">+ campo</button>
          <button class="btn btn-small save-account-btn" data-account-id="${account.id}">Guardar Conta</button>
          <button class="btn btn-danger btn-small remove-account-btn" data-account-id="${account.id}">Eliminar Conta</button>
        </div>
      </div>
    `;
  }

  function renderAccountManager(){
    const editors = state.accounts.map((a,i) => renderAccountEditor(a,i)).join('');
    return `
      ${editors || '<p class="empty-note">sem contas ainda.</p>'}
      <div class="add-account-form" id="addAccountForm">
        <input type="text" id="newAccountName" placeholder="nome da nova conta (ex: Meditação)">
        <button class="btn" id="confirmAddAccountBtn">Criar Conta</button>
      </div>
      <button class="btn btn-ghost" id="addAccountBtn">+ Nova Conta</button>
    `;
  }

  function attachAccountManagerEvents(){
    document.getElementById('addAccountBtn').addEventListener('click', () => {
      document.getElementById('addAccountForm').classList.toggle('open');
    });
    document.getElementById('confirmAddAccountBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('newAccountName');
      const name = nameInput.value.trim();
      if (!name) return;
      state.accounts.push({ id: genId('acc'), name, total: 0, fields: [] });
      render();
      await saveState();
    });

    document.querySelectorAll('.toggle-add-field-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('addFieldForm-' + btn.dataset.accountId).classList.toggle('open');
      });
    });

    document.querySelectorAll('.confirm-add-field-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const accId = btn.dataset.accountId;
        const account = getAccount(accId);
        const form = document.getElementById('addFieldForm-' + accId);
        const type = form.querySelector('.afl-type').value;
        const label = form.querySelector('.afl-label').value.trim();
        const xpVal = parseFloat(form.querySelector('.afl-xp').value) || 0;
        if (!label) return;
        if (type === 'number'){
          account.fields.push({ id: genId('f'), type: 'number', label, xpPerUnit: xpVal, bonusThreshold: null, bonusXP: 0 });
        } else {
          account.fields.push({ id: genId('f'), type: 'checkbox', label, xpBonus: xpVal, multiplyFieldId: null, multiplier: 0 });
        }
        render();
        await saveState();
      });
    });

    document.querySelectorAll('.remove-field-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const account = getAccount(btn.dataset.accountId);
        account.fields = account.fields.filter(f => f.id !== btn.dataset.fieldId);
        render();
        await saveState();
      });
    });

    document.querySelectorAll('.save-account-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const accId = btn.dataset.accountId;
        const account = getAccount(accId);
        const editorEl = document.querySelector(`.account-editor[data-account-id="${accId}"]`);
        const newName = editorEl.querySelector('.acc-name-input').value.trim();
        if (newName) account.name = newName;
        editorEl.querySelectorAll('.field-row').forEach(row => {
          const fieldId = row.dataset.fieldId;
          const field = account.fields.find(f => f.id === fieldId);
          if (!field) return;
          const label = row.querySelector('.fld-label').value.trim();
          if (label) field.label = label;
          if (row.dataset.fieldType === 'number'){
            field.xpPerUnit = parseFloat(row.querySelector('.fld-xpunit').value) || 0;
            const th = row.querySelector('.fld-threshold').value;
            field.bonusThreshold = th === '' ? null : parseFloat(th);
            field.bonusXP = parseFloat(row.querySelector('.fld-bonusxp').value) || 0;
          } else {
            field.xpBonus = parseFloat(row.querySelector('.fld-xpbonus').value) || 0;
            const mf = row.querySelector('.fld-multfield').value;
            field.multiplyFieldId = mf || null;
            const mult = row.querySelector('.fld-mult').value;
            field.multiplier = mult === '' ? 0 : parseFloat(mult);
          }
        });
        render();
        await saveState();
        document.getElementById('entryResult') && (document.getElementById('entryResult').textContent = 'Conta atualizada.');
      });
    });

    document.querySelectorAll('.remove-account-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const account = getAccount(btn.dataset.accountId);
        if (!confirm(`Eliminar a conta "${account.name}"? O XP já lançado mantém-se no histórico e no total geral, mas a conta deixa de estar disponível para novos lançamentos.`)) return;
        state.accounts = state.accounts.filter(a => a.id !== btn.dataset.accountId);
        render();
        await saveState();
      });
    });
  }

  // ---------- JOURNAL & REWARDS ----------
  function renderJournal(){
    const body = document.getElementById('journalBody');
    if (state.logs.length === 0){ body.innerHTML = '<tr class="empty-row"><td colspan="5">ainda sem lançamentos — regista a primeira sessão acima.</td></tr>'; return; }
    body.innerHTML = state.logs.map(l => `
      <tr><td>${l.date}</td><td>${escapeHtml(l.accountName)}</td><td>${escapeHtml(l.desc)}</td><td class="credit">+${fmt(l.xp)}</td><td>${escapeHtml(l.appliedTo)}</td></tr>
    `).join('');
  }

  function renderRewards(){
    const grid = document.getElementById('rewardGrid');
    if (state.rewards.length === 0){ grid.innerHTML = '<p class="empty-note">o tesouro está vazio — adiciona um prémio.</p>'; return; }
    grid.innerHTML = state.rewards.map(r => {
      const pct = Math.min(100, (r.xpEarned / r.xpRequired) * 100);
      return `<div class="reward-card">
          ${r.completed ? '<div class="stamp">ADQUIRIDO</div>' : ''}
          <h4>${escapeHtml(r.name)}</h4>
          <div class="reward-meta">${r.costEUR ? r.costEUR + '€ · ' : ''}${fmt(r.xpEarned)} / ${fmt(r.xpRequired)} XP</div>
          <div class="reward-bar-track"><div class="reward-bar-fill" style="width:${pct}%;"></div></div>
          <div class="reward-pct">${pct.toFixed(1)}%</div>
          <button class="remove-reward" data-id="${r.id}">remover</button>
        </div>`;
    }).join('');
    grid.querySelectorAll('.remove-reward').forEach(btn => {
      btn.addEventListener('click', async () => {
        state.rewards = state.rewards.filter(r => r.id !== btn.dataset.id);
        render(); await saveState();
      });
    });
  }

  async function resetAll(){
    if (!confirm('Isto apaga todo o progresso (no gist também). Tens a certeza?')) return;
    state = defaultState();
    render();
    await saveState();
  }

  // ---------- MAIN RENDER ----------
  function render(){
    const lvl = computeLevel(state.totalXP);
    const app = document.getElementById('app');
    app.innerHTML = `
      <header class="ledger-head">
        <div class="ledger-id">N.º 0001</div>
        <h1>RAZÃO XP</h1>
        <p class="subtitle">livro-razão pessoal — contas totalmente customizáveis</p>
        <div class="summary-row">
          <div class="summary-cell"><span class="label">XP Total</span><span class="value">${fmt(state.totalXP)}</span></div>
          <div class="summary-cell level-block">
            <span class="label">Nível ${lvl.level} — próximo nível em ${fmt(lvl.span - lvl.into)} XP</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(lvl.into/lvl.span*100).toFixed(1)}%;"></div></div>
          </div>
        </div>
        <label class="hardmode-toggle">
          <input type="checkbox" id="hardModeToggle" ${state.hardMode ? 'checked' : ''}>
          <span>Modo Goggins — "nunca defino uma meta que consigo alcançar". O XP ganho por sessão é reduzido (×${HARD_MODE_MULTIPLIER}); o custo dos prémios mantém-se.</span>
        </label>
        <div class="sync-bar" id="syncBar"></div>
      </header>

      <section class="accounts">
        <h2>Contas</h2>
        ${renderAccountGrid()}
      </section>

      <section class="entry-panel">
        <h2>Novo Lançamento</h2>
        ${renderEntryPanel()}
      </section>

      <section class="journal">
        <h2>Diário de Lançamentos</h2>
        <table><thead><tr><th>Data</th><th>Conta</th><th>Descrição</th><th>Crédito</th><th>Aplicado a</th></tr></thead><tbody id="journalBody"></tbody></table>
      </section>

      <section class="treasury">
        <h2>Tesouro</h2>
        <p class="section-note">Cada lançamento atribui o XP ganho a um prémio aleatório em curso.</p>
        <div class="add-reward-form" id="addRewardForm">
          <label class="field">Nome<br><input type="text" id="new-reward-name" placeholder="ex: cadeira de escritório nova" style="width:260px;"></label><br>
          <label class="field">Custo em € (opcional)<br><input type="number" id="new-reward-cost" min="0" step="1"></label>
          <label class="field">ou XP direto<br><input type="number" id="new-reward-xp" min="0" step="1"></label><br>
          <button class="btn" id="confirmAddRewardBtn" style="margin-top:8px;">Adicionar ao Tesouro</button>
        </div>
        <div class="reward-grid" id="rewardGrid"></div>
        <button class="btn btn-ghost" id="addRewardBtn">+ Adicionar Prémio</button>
      </section>

      <section class="account-manager">
        <h2>Gerir Contas</h2>
        <p class="section-note">Cria, edita ou elimina contas e os respetivos campos de XP livremente. Cada campo numérico pode ter um bónus a partir de um valor mínimo; cada campo sim/não pode dar um bónus fixo, opcionalmente multiplicado por outro campo (ex: "terminei o livro" × páginas).</p>
        ${renderAccountManager()}
      </section>

      <div class="footer-bar">guardado no teu Gist privado do GitHub · <button id="resetBtn">reiniciar tudo</button></div>
    `;

    if (state.accounts.length > 0){
      document.getElementById('accountSelect').addEventListener('change', (e) => {
        document.getElementById('dynamicFields').innerHTML = renderEntryFields(getAccount(e.target.value));
      });
      document.getElementById('logEntryBtn').addEventListener('click', () => {
        const accountId = document.getElementById('accountSelect').value;
        logEntry(accountId, readEntryValues(getAccount(accountId)));
      });
    }

    document.getElementById('hardModeToggle').addEventListener('change', async (e) => { state.hardMode = e.target.checked; await saveState(); });

    document.getElementById('addRewardBtn').addEventListener('click', () => document.getElementById('addRewardForm').classList.toggle('open'));
    document.getElementById('confirmAddRewardBtn').addEventListener('click', async () => {
      const name = document.getElementById('new-reward-name').value.trim();
      const cost = parseFloat(document.getElementById('new-reward-cost').value);
      const directXP = parseFloat(document.getElementById('new-reward-xp').value);
      if (!name) return;
      let xpRequired, costEUR = null;
      if (!isNaN(directXP) && directXP > 0){ xpRequired = Math.round(directXP); }
      else if (!isNaN(cost) && cost > 0){ costEUR = cost; xpRequired = Math.round(25 + cost * 100); }
      else { xpRequired = 500; }
      state.rewards.push({ id: genId('r'), name, costEUR, xpRequired, xpEarned: 0, completed: false });
      render(); await saveState();
    });

    document.getElementById('resetBtn').addEventListener('click', resetAll);

    attachAccountManagerEvents();
    renderJournal();
    renderRewards();
    renderSyncBar();
  }

  async function boot(){
    if (!token || !gistId){ renderSetup(); return; }
    try{
      state = safeMerge(await fetchGistState());
      localStorage.setItem(LS_CACHE, JSON.stringify(state));
      syncStatus = 'ok'; syncMsg = new Date().toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'});
    } catch(e){
      const cached = localStorage.getItem(LS_CACHE);
      if (cached){
        state = safeMerge(JSON.parse(cached));
        syncStatus = 'err'; syncMsg = 'offline — a mostrar última versão guardada localmente';
      } else {
        document.getElementById('app').innerHTML = '<div class="setup-card"><p>Não foi possível ligar ao gist: ' + e.message + '</p><button class="btn" onclick="localStorage.removeItem(\'' + LS_TOKEN + '\');localStorage.removeItem(\'' + LS_GIST + '\');location.reload();">Reconfigurar ligação</button></div>';
        return;
      }
    }
    render();
  }

  boot();
})();
</script>
</body>
</html>
