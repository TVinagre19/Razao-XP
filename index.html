<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Razão XP — Livro-Razão Pessoal</title>
    <meta name="description" content="Livro-razão pessoal e rastreador de XP gamificado com contas customizáveis e sincronização GitHub Gist." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#28344A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Razão XP" />
    <meta name="application-name" content="Razão XP" />

    <!-- Open Graph & Twitter -->
    <meta property="og:title" content="Razão XP — Livro-Razão Pessoal" />
    <meta property="og:description" content="Livro-razão pessoal e rastreador de XP gamificado com contas customizáveis." />
    <!-- Capture PWA install prompt early before React mounts -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Google Fonts for Vintage Ledger Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Spectral+SC:wght@600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#EFE8D4] text-[#221F1A] antialiased selection:bg-[#D4AF37]/30 selection:text-[#1b2333]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
